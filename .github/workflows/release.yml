name: Release

# Publishes strathora-asof to PyPI when a tag v* is pushed, with PyPI Trusted Publishing: PyPI trusts this workflow
# (owner strathora, repository asof, workflow release.yml, environment pypi), so no API token exists anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build, check and try the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG" = "v$v" || { echo "the tag $TAG does not match the version $v in pyproject.toml"; exit 1; }
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the README Quickstart
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$(ls dist/*.whl)[mcp]"
          "$RUNNER_TEMP/clean/bin/strathora" --version
          python scripts/quickstart_check.py --python "$RUNNER_TEMP/clean/bin/python"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/strathora-asof/
    permissions:
      id-token: write                       # Trusted Publishing: the short-lived token PyPI accepts; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
