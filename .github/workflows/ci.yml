name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4          # the widget snapshot tests run their JavaScript in Node: the same major version as the machine the suite was written on
        with:
          node-version: "22"
      - name: Install (package, every extra, and the dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check asof scripts demo --select E9,F,B
      - name: Types
        run: mypy asof --ignore-missing-imports
      - name: Tests
        run: python -m pytest -q
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist
