/* AsOf widget kit: dark glass, soft white text, a muted GREEN for what is good or knowable, a muted AMBER for warnings and observed measurements, a muted RED only for errors, leaks and blocked. Scoped to .asof-w so it cannot leak into a host page. No fonts or images are loaded.

   The palette is deliberately low in saturation and the glows are faint: nothing here should glare. */

  -webkit-backdrop-filter: blur(14px) saturate(105%); backdrop-filter: blur(14px) saturate(105%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 18px 40px -22px rgba(0, 0, 0, .9);
  font: 13px/1.55 -apple-system, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; max-width: 720px; width: 100%; overflow-wrap: anywhere;

.asof-tile-warm { border-color: rgba(214, 161, 75, .34); background: linear-gradient(160deg, rgba(214, 161, 75, .09), rgba(214, 161, 75, .01)); } .asof-tile-warm b { color: var(--a); }

/* data-quality chips: error red, warning amber, info white */
